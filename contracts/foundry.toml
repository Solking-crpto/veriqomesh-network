[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Monad Metropolis EVM & Network configuration
[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"
devnet = "http://127.0.0.1:8545"

[etherscan]
monad_testnet = { key = "${MONAD_EXPLORER_API_KEY}", url = "https://testnet.monadexplorer.com/api" }
